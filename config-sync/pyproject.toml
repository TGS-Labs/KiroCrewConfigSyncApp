[project]
name = "config-sync"
version = "0.1.0"
description = "Git-powered two-way sync of KiroCrew agent configuration"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.100,<7",
    "black>=24.0,<25",
    "flake8>=7.0,<8",
    "flake8-pyproject>=1.2,<2",
    "mypy>=1.10,<2",
]

[tool.black]
line-length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".venv", ".git", "__pycache__", ".hypothesis", ".pytest_cache"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
